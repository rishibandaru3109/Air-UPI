<script>
  // --- Audio Chime Generator (Native Web Audio API) ---
  function playSuccessChime() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(587.33, ctx.currentTime); // D5
      osc.frequency.setValueAtTime(880.00, ctx.currentTime + 0.1); // A5
      gain.gain.setValueAtTime(0.2, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
      osc.start();
      osc.stop(ctx.currentTime + 0.4);
    } catch (e) {}
  }

  // --- State Initialization ---
  let balance = parseFloat(localStorage.getItem('airupi_bal') || '10000');
  let currentNonce = parseInt(localStorage.getItem('airupi_nonce') || '0');
  let localLedger = JSON.parse(localStorage.getItem('airupi_ledger') || '[]');
  let knownNonces = new Set(localLedger.map(r => String(r.nonce)));

  // Render initial escrow balance
  const balDisplay = document.getElementById('escrowBalDisplay');
  if (balDisplay) balDisplay.innerText = balance.toLocaleString('en-IN');

  // Generate or retrieve persistent deterministic Ed25519 keypair
  let keyPair;
  const storedSeed = localStorage.getItem('airupi_seed');
  if (storedSeed) {
    keyPair = nacl.sign.keyPair.fromSeed(Uint8Array.from(atob(storedSeed), c => c.charCodeAt(0)));
  } else {
    keyPair = nacl.sign.keyPair();
    localStorage.setItem('airupi_seed', btoa(String.fromCharCode(...keyPair.secretKey.slice(0, 32))));
  }
  const payerPubB64 = btoa(String.fromCharCode(...keyPair.publicKey));

  // --- Role Switcher ---
  function switchRole(role) {
    if (role === 'payer') {
      document.getElementById('payerView').classList.remove('hidden');
      document.getElementById('merchantView').classList.add('hidden');
      document.getElementById('btnPayer').classList.add('active');
      document.getElementById('btnMerchant').classList.remove('active');
      stopScanner();
    } else {
      document.getElementById('payerView').classList.add('hidden');
      document.getElementById('merchantView').classList.remove('hidden');
      document.getElementById('btnMerchant').classList.add('active');
      document.getElementById('btnPayer').classList.remove('active');
      updateLedgerUI();
    }
  }

  // --- Payer: Voucher Minting Engine ---
  function generateVoucher() {
    const amtInput = document.getElementById('txAmount');
    const amount = parseInt(amtInput.value, 10);
    
    if (isNaN(amount) || amount <= 0) {
      alert("Enter a valid amount");
      return;
    }
    if (amount > balance) {
      alert("Insufficient escrow balance");
      return;
    }

    // Monotonic nonce increment per newly minted voucher
    currentNonce += 1;
    balance -= amount;
    localStorage.setItem('airupi_bal', balance);
    localStorage.setItem('airupi_nonce', currentNonce);
    if (balDisplay) balDisplay.innerText = balance.toLocaleString('en-IN');

    const timestamp = Math.floor(Date.now() / 1000);
    const canonical = `rishi@airupi|merchant@airupi|${amount}|${currentNonce}|${timestamp}`;
    const msgBytes = new TextEncoder().encode(canonical);
    const sig = nacl.sign.detached(msgBytes, keyPair.secretKey);

    const voucher = {
      v: "1",
      payer: "rishi@airupi",
      payee: "merchant@airupi",
      amt: amount,
      n: currentNonce,
      t: timestamp,
      pub: payerPubB64,
      sig: btoa(String.fromCharCode(...sig))
    };

    const qrContainer = document.getElementById("qrcode");
    qrContainer.innerHTML = "";
    new QRCode(qrContainer, {
      text: JSON.stringify(voucher),
      width: 220,
      height: 220,
      correctLevel: QRCode.CorrectLevel.M
    });
  }

  // --- Merchant: Scanner & State Machine ---
  let videoStream = null;
  let scanInterval = null;
  let isScanningLocked = false; // Lock flag to prevent frame-burst double firing
  let cooldownTimer = null;

  function toggleScanner() {
    if (videoStream) {
      stopScanner();
    } else {
      startScanner();
    }
  }

  async function startScanner() {
    if (videoStream) return;
    isScanningLocked = false;
    const status = document.getElementById('camStatus');
    const btn = document.getElementById('btnToggleCam');
    status.innerText = "STARTING...";
    status.style.color = "#facc15";

    try {
      videoStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" }, width: { ideal: 640 }, height: { ideal: 480 } }
      });
      const video = document.getElementById('webcamVideo');
      video.srcObject = videoStream;
      await video.play();

      status.innerText = "SCANNING ACTIVE";
      status.style.color = "#34d399";
      btn.innerText = "STOP SCANNER";
      btn.className = "btn-sub";

      // Scan every 120ms
      scanInterval = setInterval(scanFrame, 120);
    } catch (err) {
      alert("Camera access error: " + err.message);
      status.innerText = "ERROR";
      status.style.color = "#f43f5e";
    }
  }

  function stopScanner() {
    if (scanInterval) { 
      clearInterval(scanInterval); 
      scanInterval = null; 
    }
    if (videoStream) {
      videoStream.getTracks().forEach(t => t.stop());
      videoStream = null;
    }
    const video = document.getElementById('webcamVideo');
    if (video) video.srcObject = null;

    const status = document.getElementById('camStatus');
    if (status) {
      status.innerText = "STANDBY";
      status.style.color = "#64748b";
    }
    const btn = document.getElementById('btnToggleCam');
    if (btn) {
      btn.innerText = "START SCANNER";
      btn.className = "btn-main";
    }
  }

  function scanFrame() {
    // If optical gate is locked (cooldown / displaying green modal), skip frame
    if (isScanningLocked) return;

    const video = document.getElementById('webcamVideo');
    if (!video || video.readyState !== video.HAVE_ENOUGH_DATA) return;

    const canvas = document.getElementById('qrCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const code = jsQR(imgData.data, imgData.width, imgData.height, { inversionAttempts: "dontInvert" });

    if (code && code.data) {
      onQrScanned(code.data);
    }
  }

  function onQrScanned(text) {
    if (isScanningLocked) return;

    try {
      const v = JSON.parse(text);
      if (!v.amt || !v.n || !v.sig) return;

      const banner = document.getElementById('verdictBanner');
      const nonceKey = String(v.n);

      // --- 1. DOUBLE-SPEND DETECTION ---
      if (knownNonces.has(nonceKey)) {
        // Engage short 2.5s cooldown so the red alert does not flicker endlessly
        isScanningLocked = true;
        
        banner.classList.remove('hidden');
        banner.style.background = "rgba(244,63,94,0.18)";
        banner.style.border = "1px solid #f43f5e";
        banner.style.color = "#f43f5e";
        banner.innerHTML = `⚠ DOUBLE-SPEND DETECTED! (Nonce #${v.n} already settled)`;

        if (navigator.vibrate) navigator.vibrate([100, 50, 100]);

        // Clear red alert and re-enable scanning after 2.5 seconds
        clearTimeout(cooldownTimer);
        cooldownTimer = setTimeout(() => {
          banner.classList.add('hidden');
          isScanningLocked = false;
        }, 2500);
        return;
      }

      // --- 2. CRYPTOGRAPHIC VERIFICATION (Ed25519) ---
      const canonical = `${v.payer}|${v.payee}|${v.amt}|${v.n}|${v.t}`;
      const msgBytes = new TextEncoder().encode(canonical);
      const sigBytes = Uint8Array.from(atob(v.sig), c => c.charCodeAt(0));
      const pubBytes = Uint8Array.from(atob(v.pub), c => c.charCodeAt(0));

      const isValid = nacl.sign.detached.verify(msgBytes, sigBytes, pubBytes);

      if (!isValid) {
        isScanningLocked = true;
        banner.classList.remove('hidden');
        banner.style.background = "rgba(244,63,94,0.18)";
        banner.style.border = "1px solid #f43f5e";
        banner.style.color = "#f43f5e";
        banner.innerHTML = "⚠ INVALID SIGNATURE!";
        
        setTimeout(() => {
          banner.classList.add('hidden');
          isScanningLocked = false;
        }, 2000);
        return;
      }

      // --- 3. VALID PAYMENT: LOCK ENGINE & SHOW GREEN RESULT ---
      isScanningLocked = true; // Lock immediately to freeze further optical ingestions
      banner.classList.add('hidden');
      playSuccessChime();
      if (navigator.vibrate) navigator.vibrate(200);

      // Commit to local merchant ledger & persistent storage
      const timeStr = new Date().toLocaleTimeString();
      knownNonces.add(nonceKey);
      localLedger.unshift({ amount: v.amt, payer: v.payer, nonce: v.n, time: timeStr });
      localStorage.setItem('airupi_ledger', JSON.stringify(localLedger));
      updateLedgerUI();

      // Populate and reveal green verified modal
      document.getElementById('modalAmount').innerText = v.amt;
      document.getElementById('modalPayer').innerText = v.payer;
      document.getElementById('modalNonce').innerText = '#' + v.n;
      document.getElementById('modalTime').innerText = timeStr;
      
      const modal = document.getElementById('successModal');
      modal.classList.remove('hidden');

      // Enforce the green screen to stay visible for at least 3 seconds
      const nextBtn = modal.querySelector('button');
      if (nextBtn) {
        nextBtn.disabled = true;
        nextBtn.style.opacity = "0.5";
        nextBtn.innerText = "VERIFYING (3s)...";

        let countdown = 3;
        const countInterval = setInterval(() => {
          countdown -= 1;
          if (countdown > 0) {
            nextBtn.innerText = `READY IN (${countdown}s)...`;
          } else {
            clearInterval(countInterval);
            nextBtn.disabled = false;
            nextBtn.style.opacity = "1";
            nextBtn.innerText = "SCAN NEXT";
          }
        }, 1000);
      }

    } catch (err) {
      // Ignore invalid JSON / non-AirUPI barcodes
    }
  }

  // --- Modal Dismissal & Resuming Scanner ---
  function dismissSuccessAndResume() {
    document.getElementById('successModal').classList.add('hidden');
    // Cooldown pause of 1.5s after clicking 'SCAN NEXT' before camera accepts frames again
    setTimeout(() => {
      isScanningLocked = false;
    }, 1500);
  }

  // --- Ledger UI Updater ---
  function updateLedgerUI() {
    const list = document.getElementById('receiptsList');
    if (!list) return;
    if (localLedger.length === 0) {
      list.innerHTML = `<p style="font-size:11px; color:#64748b; text-align:center; padding:8px;" class="mono">No records present</p>`;
      return;
    }
    list.innerHTML = localLedger.map(r => `
      <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 10px; background:var(--bg); border:1px solid var(--border); border-radius:6px; font-size:11px;" class="mono">
        <div><b style="color:white;">₹${r.amount}</b> <span style="color:#64748b;">#${r.nonce}</span></div>
        <span style="color:#60a5fa;">${r.time}</span>
      </div>
    `).join('');
  }

  // Ensure initial render
  updateLedgerUI();
</script>
