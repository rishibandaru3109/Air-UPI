<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AirUPI | Zero-RF Optical Payments</title>
  
  <!-- Cryptographic, Optical & QR Libraries -->
  <script src="/static/js/nacl-fast.min.js"></script>
  <script src="/static/js/jsQR.min.js"></script>
  <script src="/static/js/qrcode.min.js"></script>

  <style>
    :root[data-theme="dark"] {
      --bg: #090d16;
      --card-bg: #0f172a;
      --sub-card: #060911;
      --border: #1e293b;
      --text: #f8fafc;
      --text-muted: #64748b;
      --text-secondary: #94a3b8;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.15);
      --success: #10b981;
      --danger: #f43f5e;
      --danger-bg: rgba(244, 63, 94, 0.15);
      --input-bg: #020617;
    }

    :root[data-theme="light"] {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --sub-card: #f1f5f9;
      --border: #cbd5e1;
      --text: #0f172a;
      --text-muted: #64748b;
      --text-secondary: #334155;
      --accent: #0284c7;
      --accent-glow: rgba(2, 132, 199, 0.1);
      --success: #059669;
      --danger: #e11d48;
      --danger-bg: rgba(225, 29, 72, 0.1);
      --input-bg: #f8fafc;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
      transition: background-color 0.2s, color 0.2s;
    }

    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .hidden { display: none !important; }

    .app-card {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand { font-size: 18px; font-weight: 800; letter-spacing: -0.02em; }
    .brand span { color: var(--accent); }

    .theme-toggle-btn {
      background: var(--sub-card);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 11px;
      padding: 5px 10px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
    }

    .role-switcher {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--sub-card);
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--border);
      gap: 4px;
    }
    .role-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-weight: 700;
      font-size: 13px;
      padding: 8px 0;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .role-btn.active {
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--border);
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .banner-alert {
      padding: 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      text-align: center;
    }

    .escrow-pill {
      background: var(--sub-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .input-group { display: flex; flex-direction: column; gap: 6px; }
    .input-group label { font-size: 11px; font-weight: 700; color: var(--text-muted); }
    .input-field {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 8px;
      color: var(--text);
      font-size: 16px;
      outline: none;
    }
    .input-field:focus { border-color: var(--accent); }

    .btn-main {
      width: 100%;
      background: var(--accent);
      color: #ffffff;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 4px 14px var(--accent-glow);
    }
    .btn-sub {
      width: 100%;
      background: var(--sub-card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }

    #qrcode {
      display: flex;
      justify-content: center;
      padding: 16px;
      background: #ffffff;
      border-radius: 12px;
      margin: 12px auto 0;
      width: fit-content;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
    }

    .scanner-box {
      position: relative;
      width: 100%;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      aspect-ratio: 4/3;
      border: 1px solid var(--border);
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #webcamVideo { width: 100%; height: 100%; object-fit: cover; }
    .crosshair-overlay {
      position: absolute;
      width: 180px;
      height: 180px;
      border: 2px dashed var(--accent);
      border-radius: 12px;
      pointer-events: none;
    }

    .ledger-container {
      background: var(--sub-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
    }
    .ledger-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 11px;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      z-index: 1000;
    }
    .modal-card {
      width: 100%;
      max-width: 360px;
      background: var(--card-bg);
      border: 2px solid var(--success);
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(16, 185, 129, 0.2);
    }
  </style>
</head>
<body>

  <div class="app-card">
    
    <!-- Top Bar -->
    <div class="top-bar">
      <div class="brand">Air<span>UPI</span> <span style="font-size: 10px; font-weight: 500; color: var(--text-muted);" class="mono">ZERO-RF</span></div>
      <button class="theme-toggle-btn mono" onclick="toggleTheme()" id="themeBtn">☀️ LIGHT</button>
    </div>

    <!-- Network / Air-Gap Badge -->
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <div style="display: flex; align-items: center; gap: 6px;">
        <span id="syncIndicator" style="width: 8px; height: 8px; border-radius: 50%; background: #94a3b8;"></span>
        <span style="font-size: 11px; color: var(--text-muted);" class="mono" id="deviceNodeIdDisplay">DEV-INIT</span>
      </div>
      <span id="networkStatusBadge" style="font-size: 10px; padding: 3px 8px; border-radius: 6px; background: var(--danger-bg); color: var(--danger); border: 1px solid var(--danger);" class="mono">
        AIR-GAP: OFFLINE
      </span>
    </div>

    <!-- Role Switcher -->
    <div class="role-switcher">
      <button class="role-btn active" id="btnPayer" onclick="switchRole('payer')">PAYER (MINT)</button>
      <button class="role-btn" id="btnMerchant" onclick="switchRole('merchant')">MERCHANT (POS)</button>
    </div>

    <!-- Reusable Dynamic Alert Banner -->
    <div id="verdictBanner" class="banner-alert mono hidden"></div>

    <!-- PAYER VIEW -->
    <div id="payerView" style="display: flex; flex-direction: column; gap: 14px;">
      <div class="escrow-pill">
        <div>
          <div style="font-size: 10px; font-weight: 700; color: var(--text-muted);">ESCROW BALANCE</div>
          <div style="font-size: 20px; font-weight: 800; color: var(--text); margin-top: 2px;">₹<span id="escrowBalDisplay">10,000</span></div>
        </div>
        <span style="font-size: 10px; padding: 4px 8px; border-radius: 6px; background: rgba(56, 189, 248, 0.1); color: var(--accent); border: 1px solid var(--border);" class="mono">RESERVE</span>
      </div>

      <div class="input-group">
        <label>TRANSACTION AMOUNT (INR)</label>
        <input type="number" id="txAmount" class="input-field mono" value="150" min="1" />
      </div>

      <button class="btn-main" onclick="generateVoucher()">MINT OFFLINE VOUCHER</button>
      <div id="qrcode"></div>
    </div>

    <!-- MERCHANT VIEW -->
    <div id="merchantView" class="hidden" style="display: flex; flex-direction: column; gap: 14px;">
      <div class="scanner-box">
        <video id="webcamVideo" playsinline autoplay muted></video>
        <canvas id="qrCanvas" class="hidden"></canvas>
        <div class="crosshair-overlay"></div>
      </div>

      <div style="display: flex; justify-content: space-between; align-items: center; padding: 0 4px;" class="mono">
        <span style="font-size: 11px; color: var(--text-muted);">STATUS</span>
        <span id="camStatus" style="font-size: 11px; font-weight: 700; color: var(--text-muted);">STANDBY</span>
      </div>

      <button class="btn-main" id="btnToggleCam" onclick="toggleScanner()">START SCANNER</button>
    </div>

    <!-- UNIFIED TRANSACTION HISTORY -->
    <div class="ledger-container">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <span style="font-size: 11px; font-weight: 800; letter-spacing: 0.05em; color: var(--text-secondary);" class="mono">TRANSACTION HISTORY</span>
        <button onclick="clearCurrentRoleLedger()" style="background: none; border: none; font-size: 10px; color: var(--text-muted); cursor: pointer;" class="mono">RESET</button>
      </div>
      <div id="unifiedLedgerList" style="display: flex; flex-direction: column; gap: 8px; max-height: 200px; overflow-y: auto;">
        <p style="font-size: 11px; color: var(--text-muted); text-align: center; padding: 12px 0;" class="mono">No records present</p>
      </div>
    </div>

  </div>

  <!-- GREEN VERIFIED SUCCESS MODAL -->
  <div id="successModal" class="modal-overlay hidden">
    <div class="modal-card">
      <div style="font-size: 40px; margin-bottom: 8px;">✓</div>
      <h3 style="color: var(--success); font-size: 18px; margin-bottom: 4px;">PAYMENT VERIFIED</h3>
      <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 16px;">ED25519 AIR-GAP SIGNATURE VALID</p>

      <div style="background: var(--sub-card); border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 20px; text-align: left;" class="mono">
        <div style="display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 6px;">
          <span style="color: var(--text-muted);">Amount:</span>
          <b style="color: var(--text);">₹<span id="modalAmount">0</span></b>
        </div>
        <div style="display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 6px;">
          <span style="color: var(--text-muted);">Payer:</span>
          <span id="modalPayer" style="color: var(--text-secondary);">--</span>
        </div>
        <div style="display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 6px;">
          <span style="color: var(--text-muted);">Nonce:</span>
          <span id="modalNonce" style="color: var(--accent);">--</span>
        </div>
        <div style="display: flex; justify-content: space-between; font-size: 12px;">
          <span style="color: var(--text-muted);">Time:</span>
          <span id="modalTime" style="color: var(--text-secondary);">--</span>
        </div>
      </div>

      <button id="modalNextBtn" class="btn-main" onclick="dismissSuccessAndResume()">SCAN NEXT</button>
    </div>
  </div>

  <!-- SCRIPT ENGINE -->
  <script>
    // --- 1. Audio Synthesizer ---
    function playSuccessChime() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, ctx.currentTime);
        osc.frequency.setValueAtTime(880.00, ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
        osc.start();
        osc.stop(ctx.currentTime + 0.4);
      } catch (e) {}
    }

    // --- 2. Theme Toggle ---
    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('airupi_theme', next);
      document.getElementById('themeBtn').innerText = next === 'dark' ? '☀️ LIGHT' : '🌙 DARK';
    }
    const savedTheme = localStorage.getItem('airupi_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    document.getElementById('themeBtn').innerText = savedTheme === 'dark' ? '☀️ LIGHT' : '🌙 DARK';

    // --- 3. Device Identification ---
    function getOrCreateDeviceId() {
      let devId = localStorage.getItem('airupi_device_id');
      if (!devId) {
        devId = "DEV-" + Math.random().toString(36).substring(2, 8).toUpperCase();
        localStorage.setItem('airupi_device_id', devId);
      }
      return devId;
    }
    const CURRENT_DEVICE_ID = getOrCreateDeviceId();
    document.getElementById('deviceNodeIdDisplay').innerText = CURRENT_DEVICE_ID;

    // --- 4. State Management ---
    let balance = parseFloat(localStorage.getItem('airupi_bal') || '10000');
    let currentNonce = parseInt(localStorage.getItem('airupi_nonce') || '0');
    let activeRole = 'payer';

    const balDisplay = document.getElementById('escrowBalDisplay');
    if (balDisplay) balDisplay.innerText = balance.toLocaleString('en-IN');

    // Cryptographic Key Initialization
    let keyPair;
    const storedSeed = localStorage.getItem('airupi_seed');
    if (storedSeed) {
      keyPair = nacl.sign.keyPair.fromSeed(Uint8Array.from(atob(storedSeed), c => c.charCodeAt(0)));
    } else {
      keyPair = nacl.sign.keyPair();
      localStorage.setItem('airupi_seed', btoa(String.fromCharCode(...keyPair.secretKey.slice(0, 32))));
    }
    const payerPubB64 = btoa(String.fromCharCode(...keyPair.publicKey));

    function getLocalLedger(role) {
      const key = role === 'payer' ? 'airupi_payer_ledger' : 'airupi_merchant_ledger';
      return JSON.parse(localStorage.getItem(key) || '[]');
    }

    function saveLocalLedger(role, ledger) {
      const key = role === 'payer' ? 'airupi_payer_ledger' : 'airupi_merchant_ledger';
      localStorage.setItem(key, JSON.stringify(ledger));
    }

    let knownNonces = new Set(getLocalLedger('merchant').map(r => String(r.n)));

    // --- 5. Role Switcher ---
    function switchRole(role) {
      activeRole = role;
      if (role === 'payer') {
        document.getElementById('payerView').classList.remove('hidden');
        document.getElementById('merchantView').classList.add('hidden');
        document.getElementById('btnPayer').classList.add('active');
        document.getElementById('btnMerchant').classList.remove('active');
        stopScanner();
      } else {
        document.getElementById('payerView').classList.add('hidden');
        document.getElementById('merchantView').classList.remove('hidden');
        document.getElementById('btnMerchant').classList.add('active');
        document.getElementById('btnPayer').classList.remove('active');
      }
      renderLedger(role);
      triggerAutoSync(role);
    }

    // --- 6. Render Ledger ---
    function renderLedger(role) {
      const listEl = document.getElementById('unifiedLedgerList');
      if (!listEl) return;
      const ledger = getLocalLedger(role);

      if (ledger.length === 0) {
        listEl.innerHTML = `<p style="font-size: 11px; color: var(--text-muted); text-align: center; padding: 12px 0;" class="mono">No records present</p>`;
        return;
      }

      listEl.innerHTML = ledger.map(tx => {
        const isPayer = role === 'payer';
        const sign = isPayer ? "-" : "+";
        const color = isPayer ? "var(--danger)" : "var(--success)";
        const counterparty = isPayer ? (tx.payee || "merchant@airupi") : (tx.payer || "payer@airupi");
        const syncBadge = tx.synced 
          ? `<span style="color: #38bdf8; font-size: 9px; padding: 2px 6px; background: rgba(56,189,248,0.1); border-radius: 4px;">SYNCED ✓</span>` 
          : `<span style="color: #f59e0b; font-size: 9px; padding: 2px 6px; background: rgba(245,158,11,0.1); border-radius: 4px;">OFFLINE ⏳</span>`;

        return `
          <div class="ledger-item mono">
            <div>
              <div style="display: flex; align-items: center; gap: 8px;">
                <b style="color: ${color}; font-size: 13px;">${sign}₹${tx.amt}</b>
                ${syncBadge}
              </div>
              <div style="font-size: 10px; color: var(--text-muted); margin-top: 3px;">
                Party: <span style="color: var(--text-secondary);">${counterparty}</span>
              </div>
              <div style="font-size: 9px; color: var(--text-muted);">
                Target: ${tx.targetDeviceId || "SCAN_OPTICAL"} | Nonce #${tx.n}
              </div>
            </div>
            <div style="text-align: right; font-size: 10px; color: var(--text-muted);">
              <div>${new Date(tx.t * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    function clearCurrentRoleLedger() {
      saveLocalLedger(activeRole, []);
      if (activeRole === 'merchant') knownNonces.clear();
      renderLedger(activeRole);
    }

    // --- 7. Payer: Voucher Generator ---
    function generateVoucher() {
      const amtInput = document.getElementById('txAmount');
      const amount = parseInt(amtInput.value, 10);

      if (isNaN(amount) || amount <= 0) return alert("Enter valid amount");
      if (amount > balance) return alert("Insufficient escrow balance");

      currentNonce += 1;
      balance -= amount;
      localStorage.setItem('airupi_bal', balance);
      localStorage.setItem('airupi_nonce', currentNonce);
      if (balDisplay) balDisplay.innerText = balance.toLocaleString('en-IN');

      const timestamp = Math.floor(Date.now() / 1000);
      const canonical = `rishi@airupi|merchant@airupi|${amount}|${currentNonce}|${timestamp}`;
      const msgBytes = new TextEncoder().encode(canonical);
      const sig = nacl.sign.detached(msgBytes, keyPair.secretKey);

      const voucher = {
        v: "1",
        payer: "rishi@airupi",
        payee: "merchant@airupi",
        amt: amount,
        n: currentNonce,
        t: timestamp,
        devId: CURRENT_DEVICE_ID,
        pub: payerPubB64,
        sig: btoa(String.fromCharCode(...sig))
      };

      const qrContainer = document.getElementById("qrcode");
      qrContainer.innerHTML = "";
      new QRCode(qrContainer, {
        text: JSON.stringify(voucher),
        width: 220,
        height: 220,
        correctLevel: QRCode.CorrectLevel.M
      });

      const pLedger = getLocalLedger('payer');
      pLedger.unshift({ ...voucher, targetDeviceId: "MERCHANT_TERMINAL", synced: false });
      saveLocalLedger('payer', pLedger);
      renderLedger('payer');
      triggerAutoSync('payer');
    }

    // --- 8. Merchant: Optical Scanner State Machine ---
    let videoStream = null;
    let scanInterval = null;
    let isScanningLocked = false;
    let cooldownTimer = null;

    function toggleScanner() {
      if (videoStream) stopScanner();
      else startScanner();
    }

    async function startScanner() {
      if (videoStream) return;
      isScanningLocked = false;
      const status = document.getElementById('camStatus');
      const btn = document.getElementById('btnToggleCam');
      status.innerText = "STARTING...";
      status.style.color = "#facc15";

      try {
        videoStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" }, width: { ideal: 640 }, height: { ideal: 480 } }
        });
        const video = document.getElementById('webcamVideo');
        video.srcObject = videoStream;
        await video.play();

        status.innerText = "SCANNING ACTIVE";
        status.style.color = "var(--success)";
        btn.innerText = "STOP SCANNER";
        btn.className = "btn-sub";

        scanInterval = setInterval(scanFrame, 120);
      } catch (err) {
        alert("Camera error: " + err.message);
        status.innerText = "ERROR";
        status.style.color = "var(--danger)";
      }
    }

    function stopScanner() {
      if (scanInterval) { clearInterval(scanInterval); scanInterval = null; }
      if (videoStream) {
        videoStream.getTracks().forEach(t => t.stop());
        videoStream = null;
      }
      const video = document.getElementById('webcamVideo');
      if (video) video.srcObject = null;
      const status = document.getElementById('camStatus');
      if (status) { status.innerText = "STANDBY"; status.style.color = "var(--text-muted)"; }
      const btn = document.getElementById('btnToggleCam');
      if (btn) { btn.innerText = "START SCANNER"; btn.className = "btn-main"; }
    }

    function scanFrame() {
      if (isScanningLocked) return;
      const video = document.getElementById('webcamVideo');
      if (!video || video.readyState !== video.HAVE_ENOUGH_DATA) return;

      const canvas = document.getElementById('qrCanvas');
      const ctx = canvas.getContext('2d');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = jsQR(imgData.data, imgData.width, imgData.height, { inversionAttempts: "dontInvert" });

      if (code && code.data) {
        onQrScanned(code.data);
      }
    }

    function onQrScanned(text) {
      if (isScanningLocked) return;

      try {
        const v = JSON.parse(text);
        if (!v.amt || !v.n || !v.sig) return;

        const banner = document.getElementById('verdictBanner');
        const nonceKey = String(v.n);

        // Check for double-spend
        if (knownNonces.has(nonceKey)) {
          isScanningLocked = true;
          banner.classList.remove('hidden');
          banner.style.background = "var(--danger-bg)";
          banner.style.border = "1px solid var(--danger)";
          banner.style.color = "var(--danger)";
          banner.innerHTML = `⚠ DOUBLE-SPEND DETECTED! (Nonce #${v.n} already settled)`;
          if (navigator.vibrate) navigator.vibrate([100, 50, 100]);

          clearTimeout(cooldownTimer);
          cooldownTimer = setTimeout(() => {
            banner.classList.add('hidden');
            isScanningLocked = false;
          }, 2500);
          return;
        }

        // Verify Ed25519 signature
        const canonical = `${v.payer}|${v.payee}|${v.amt}|${v.n}|${v.t}`;
        const msgBytes = new TextEncoder().encode(canonical);
        const sigBytes = Uint8Array.from(atob(v.sig), c => c.charCodeAt(0));
        const pubBytes = Uint8Array.from(atob(v.pub), c => c.charCodeAt(0));
        const isValid = nacl.sign.detached.verify(msgBytes, sigBytes, pubBytes);

        if (!isValid) {
          isScanningLocked = true;
          banner.classList.remove('hidden');
          banner.style.background = "var(--danger-bg)";
          banner.style.border = "1px solid var(--danger)";
          banner.style.color = "var(--danger)";
          banner.innerHTML = "⚠ INVALID SIGNATURE!";
          setTimeout(() => {
            banner.classList.add('hidden');
            isScanningLocked = false;
          }, 2000);
          return;
        }

        // Verification successful
        isScanningLocked = true;
        banner.classList.add('hidden');
        playSuccessChime();
        if (navigator.vibrate) navigator.vibrate(200);

        knownNonces.add(nonceKey);
        const mLedger = getLocalLedger('merchant');
        mLedger.unshift({ ...v, targetDeviceId: CURRENT_DEVICE_ID, synced: false });
        saveLocalLedger('merchant', mLedger);
        renderLedger('merchant');
        triggerAutoSync('merchant');

        // Show green modal with 3s lockout
        document.getElementById('modalAmount').innerText = v.amt;
        document.getElementById('modalPayer').innerText = v.payer;
        document.getElementById('modalNonce').innerText = '#' + v.n;
        document.getElementById('modalTime').innerText = new Date(v.t * 1000).toLocaleTimeString();

        const modal = document.getElementById('successModal');
        modal.classList.remove('hidden');

        const nextBtn = document.getElementById('modalNextBtn');
        nextBtn.disabled = true;
        nextBtn.style.opacity = "0.5";
        nextBtn.innerText = "VERIFYING (3s)...";

        let countdown = 3;
        const countInterval = setInterval(() => {
          countdown -= 1;
          if (countdown > 0) {
            nextBtn.innerText = `READY IN (${countdown}s)...`;
          } else {
            clearInterval(countInterval);
            nextBtn.disabled = false;
            nextBtn.style.opacity = "1";
            nextBtn.innerText = "SCAN NEXT";
          }
        }, 1000);

      } catch (err) {}
    }

    function dismissSuccessAndResume() {
      document.getElementById('successModal').classList.add('hidden');
      setTimeout(() => { isScanningLocked = false; }, 1500);
    }

    // --- 9. Background Auto-Sync Engine ---
    async function triggerAutoSync(role) {
      if (!navigator.onLine) {
        updateNetworkBadge(false);
        return;
      }

      const ledger = getLocalLedger(role);
      const unsynced = ledger.filter(tx => !tx.synced);
      if (unsynced.length === 0) {
        updateNetworkBadge(true);
        return;
      }

      const endpoint = role === 'payer' ? '/api/sync/payer' : '/api/sync/merchant';

      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 2500);

        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ deviceId: CURRENT_DEVICE_ID, records: unsynced }),
          signal: controller.signal
        });
        clearTimeout(timeoutId);

        if (res.ok) {
          const data = await res.json();
          const syncedNonces = new Set(data.synced || []);
          const updated = ledger.map(tx => syncedNonces.has(tx.n) ? { ...tx, synced: true } : tx);
          saveLocalLedger(role, updated);
          renderLedger(role);
          updateNetworkBadge(true);

          const indicator = document.getElementById('syncIndicator');
          if (indicator) {
            indicator.style.background = "var(--success)";
            setTimeout(() => { indicator.style.background = "#94a3b8"; }, 2000);
          }
        }
      } catch (err) {
        updateNetworkBadge(false);
      }
    }

    function updateNetworkBadge(isOnline) {
      const badge = document.getElementById('networkStatusBadge');
      if (!badge) return;
      if (isOnline) {
        badge.innerText = "ONLINE: RECONCILED";
        badge.style.background = "rgba(16,185,129,0.15)";
        badge.style.color = "var(--success)";
        badge.style.border = "1px solid var(--success)";
      } else {
        badge.innerText = "AIR-GAP: OFFLINE";
        badge.style.background = "var(--danger-bg)";
        badge.style.color = "var(--danger)";
        badge.style.border = "1px solid var(--danger)";
      }
    }

    window.addEventListener('online', () => {
      triggerAutoSync('payer');
      triggerAutoSync('merchant');
    });

    setInterval(() => {
      if (navigator.onLine) {
        triggerAutoSync('payer');
        triggerAutoSync('merchant');
      } else {
        updateNetworkBadge(false);
      }
    }, 5000);

    // Initial render
    renderLedger('payer');
  </script>
</body>
</html>
